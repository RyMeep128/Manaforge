name: XMage coverage audit regression
on:
  push:
    paths:
      - 'Mtg_Projects/mtg_play/**'
      - 'tools/build_xmage_backlog.py'
      - '.github/workflows/xmage-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Coverage, identity, classification and report regressions
        working-directory: Mtg_Projects
        env:
          QT_QPA_PLATFORM: offscreen
          PRINT_PROXY_PREP_DATA_DIR: ${{ runner.temp }}/audit-data
        run: python -m pytest -q mtg_play/tests/test_xmage_support.py mtg_play/tests/test_xmage_backlog.py mtg_play/tests/test_xmage_audit.py
