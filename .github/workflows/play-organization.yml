name: Play organization reducer
on:
  push:
    paths: ['Mtg_Projects/mtg_play/java/organization/**', 'Mtg_Projects/mtg_play/java/organization-test/**', 'tools/check_play_organization.py', '.github/workflows/play-organization.yml']
  pull_request:
    paths: ['Mtg_Projects/mtg_play/java/organization/**', 'Mtg_Projects/mtg_play/java/organization-test/**', 'tools/check_play_organization.py', '.github/workflows/play-organization.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  organization-reducer:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '23.0.2+7'
      - name: Pure group model, operations and lifecycle invariants
        run: python tools/check_play_organization.py --jdk-path "$env:JAVA_HOME"
