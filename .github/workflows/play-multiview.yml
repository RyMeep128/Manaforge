name: Play native two-viewer coordinator
on:
  push:
    paths: ['Mtg_Projects/mtg_play/java/organization-native/**', 'Mtg_Projects/mtg_play/java/organization/**', 'Mtg_Projects/mtg_play/java/organization-wire/**', 'Mtg_Projects/mtg_play/java/*Identity*.java', 'Mtg_Projects/mtg_play/java/payment-native-test/NativeBattlefieldIdentityChecks.java', 'Mtg_Projects/mtg_play/java/ManaforgeMatchCoordinator.java', 'Mtg_Projects/mtg_play/java/ManaforgeOpeningProjection.java', 'Mtg_Projects/mtg_play/java/ManaforgeBridge.java', 'Mtg_Projects/mtg_play/java/payment-native-test/NativeMultiViewerChecks.java', 'Mtg_Projects/mtg_play/java/payment-native-test/NativePaymentAcceptanceChecks.java', 'Mtg_Projects/mtg_play/protocol/**', 'tools/check_play_payment_coordinator.py', '.github/workflows/play-multiview.yml']
  pull_request:
    paths: ['Mtg_Projects/mtg_play/java/organization-native/**', 'Mtg_Projects/mtg_play/java/organization/**', 'Mtg_Projects/mtg_play/java/organization-wire/**', 'Mtg_Projects/mtg_play/java/*Identity*.java', 'Mtg_Projects/mtg_play/java/payment-native-test/NativeBattlefieldIdentityChecks.java', 'Mtg_Projects/mtg_play/java/ManaforgeMatchCoordinator.java', 'Mtg_Projects/mtg_play/java/ManaforgeOpeningProjection.java', 'Mtg_Projects/mtg_play/java/ManaforgeBridge.java', 'Mtg_Projects/mtg_play/java/payment-native-test/NativeMultiViewerChecks.java', 'Mtg_Projects/mtg_play/java/payment-native-test/NativePaymentAcceptanceChecks.java', 'Mtg_Projects/mtg_play/protocol/**', 'tools/check_play_payment_coordinator.py', '.github/workflows/play-multiview.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-two-viewer:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [stock, delivery]
    env:
      PYTHONPATH: '${{ github.workspace }}/Mtg_Projects;${{ github.workspace }}/Mtg_Projects/mtg_core'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '23.0.2+7'
      - run: python -m pip install -r requirements-dev.txt
      - name: Prepare stock compatibility engine
        if: matrix.engine == 'stock'
        run: python -m mtg_play.ci_prepare --destination "$env:RUNNER_TEMP/manaforge-multiview-engine" --jdk-path "$env:JAVA_HOME"
      - name: Prepare hash-pinned delivery engine
        if: matrix.engine == 'delivery'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/prepare_payment_ci_engine.py --destination "$env:RUNNER_TEMP/manaforge-multiview-engine" --jdk-path "$env:JAVA_HOME"
      - name: Native two-seat privacy and match lifetime proof
        run: python tools/check_play_payment_coordinator.py --probe-pinned-helpers --real-game-multiview --xmage-root "$env:RUNNER_TEMP/manaforge-multiview-engine" --javap "$env:JAVA_HOME/bin/javap.exe"
