name: Play protocol fixtures

on:
  push:
    paths:
      - 'Mtg_Projects/mtg_play/protocol/**'
      - 'Mtg_Projects/mtg_play/java/organization/**'
      - 'Mtg_Projects/mtg_play/java/organization-wire/**'
      - 'Mtg_Projects/mtg_play/java/ManaforgeOpening*.java'
      - 'Mtg_Projects/mtg_play/java/ManaforgeUnityOpening.java'
      - 'Mtg_Projects/mtg_play/java/ManaforgeMatchCoordinator.java'
      - 'Mtg_Projects/mtg_play/gateway_bootstrap.py'
      - 'Mtg_Projects/mtg_play/launch_lifecycle.py'
      - 'Mtg_Projects/mtg_play/launch_manifest.py'
      - 'tools/check_play_gateway_launch.py'
      - 'Mtg_Projects/mtg_play/java/payment/**'
      - 'Mtg_Projects/mtg_play/java/payment-gateway/**'
      - 'Mtg_Projects/mtg_play/java/payment-test/**'
      - 'Mtg_Projects/mtg_play/java/payment-xmage/**'
      - 'Mtg_Projects/mtg_play/java/payment-native-test/**'
      - 'tools/check_play_payment_coordinator.py'
      - 'Mtg_Projects/mtg_play/protocol_schema.py'
      - 'Mtg_Projects/mtg_play/artifacts.json'
      - 'Mtg_Projects/mtg_play_unity/Assets/Manaforge/Runtime/Protocol/**'
      - 'tools/*play*protocol*.py'
      - 'tools/generate_play_models.py'
      - 'tools/generate_play_organization_fixtures.py'
      - '.github/workflows/play-protocol.yml'
  pull_request:
    paths:
      - 'Mtg_Projects/mtg_play/protocol/**'
      - 'Mtg_Projects/mtg_play/java/organization/**'
      - 'Mtg_Projects/mtg_play/java/organization-wire/**'
      - 'Mtg_Projects/mtg_play/java/ManaforgeOpening*.java'
      - 'Mtg_Projects/mtg_play/java/ManaforgeUnityOpening.java'
      - 'Mtg_Projects/mtg_play/java/ManaforgeMatchCoordinator.java'
      - 'Mtg_Projects/mtg_play/gateway_bootstrap.py'
      - 'Mtg_Projects/mtg_play/launch_lifecycle.py'
      - 'Mtg_Projects/mtg_play/launch_manifest.py'
      - 'tools/check_play_gateway_launch.py'
      - 'Mtg_Projects/mtg_play/java/payment/**'
      - 'Mtg_Projects/mtg_play/java/payment-gateway/**'
      - 'Mtg_Projects/mtg_play/java/payment-test/**'
      - 'Mtg_Projects/mtg_play/java/payment-xmage/**'
      - 'Mtg_Projects/mtg_play/java/payment-native-test/**'
      - 'tools/check_play_payment_coordinator.py'
      - 'Mtg_Projects/mtg_play/protocol_schema.py'
      - 'Mtg_Projects/mtg_play/artifacts.json'
      - 'Mtg_Projects/mtg_play_unity/Assets/Manaforge/Runtime/Protocol/**'
      - 'tools/*play*protocol*.py'
      - 'tools/generate_play_models.py'
      - 'tools/generate_play_organization_fixtures.py'
      - '.github/workflows/play-protocol.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-fixture-consumer:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '23.0.2+7'
      - name: Check organization shared corpus drift
        run: python tools/generate_play_organization_fixtures.py --check
      - name: Check generated Java and CSharp models
        run: python tools/generate_play_models.py --check
      - name: Compile and run Java fixture consumer with pinned Gson
        run: python tools/check_play_java_protocol.py --download-gson --dummy-output Mtg_Projects/mtg_play_unity/Artifacts/JavaDummy
      - name: Install native Core import dependency
        run: python -m pip install certifi==2026.10.23
      - name: Validate private native-deck launch and owned Java cleanup
        run: python tools/check_play_gateway_launch.py

      - name: Upload sanitized private-launch evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: private-launch-${{ github.sha }}
          path: Mtg_Projects/mtg_play_unity/Artifacts/GatewayLaunchProof/report.json
          if-no-files-found: error

      - name: Check isolated Java payment coordinator safety
        run: python tools/check_play_payment_coordinator.py
