name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      verify_xmage:
        description: Force pinned XMage acceptance even when the latest commit has no adapter or Core changes
        type: boolean
        default: false
      skip_tests:
        description: Skip tests and smoke checks for this explicitly requested manual build
        type: boolean
        default: false
      build_windows:
        description: Build the existing Manaforge Windows bundle as a CI artifact
        type: boolean
        default: false
      publish_windows_prerelease:
        description: Publish the tested Windows bundle as an application prerelease
        type: boolean
        default: false
      recommendation_release_tag:
        description: Optional staged recommendation-data prerelease tag to validate and publish
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
    name: Windows / Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            Mtg_Projects/mtg_proxy/requirements.txt
      - name: Install test and application dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install optional library server dependency for CI
        run: python -m pip install -r requirements-library.txt
      - name: Test Proxy, Core, Deck Editor, and their integration
        working-directory: Mtg_Projects
        env:
          PRINT_PROXY_PREP_DATA_DIR: ${{ runner.temp }}/mtg-suite-test-data
          MANAFORGE_UI_SCREENSHOTS: ${{ runner.temp }}/manaforge-ui
          MANAFORGE_CATEGORY_EVALUATION: ${{ runner.temp }}/categorization-evaluation.json
        run: python -m pytest -vv --tb=short --durations=10 -o faulthandler_timeout=120 mtg_editor/tests integration_tests mtg_proxy/tests mtg_core/tests mtg_play/tests
      - name: Determine XMage acceptance scope
        id: xmage-scope
        if: ${{ !cancelled() && matrix.python == '3.12' }}
        env:
          XMAGE_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_xmage }}
        run: |
          $changed = @(git diff --name-only 'HEAD^' HEAD)
          $verify = $LASTEXITCODE -ne 0 -or [bool]($changed -match '^Mtg_Projects/(mtg_play|mtg_core)/|^\.github/workflows/tests\.yml$') -or $env:XMAGE_FORCE -eq 'true'
          "verify=$($verify.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Set up the bridge compiler
        id: xmage-compiler
        if: ${{ !cancelled() && matrix.python == '3.12' && steps.xmage-scope.outputs.verify == 'true' }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '23.0.2+7'
      - name: Prepare SHA-256-pinned XMage and runtime in a new CI directory
        id: xmage-prepare
        if: ${{ !cancelled() && steps.xmage-compiler.outcome == 'success' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/Mtg_Projects
        run: python -m mtg_play.ci_prepare --destination "$env:RUNNER_TEMP/manaforge-xmage" --jdk-path "$env:JAVA_HOME"
      - name: Verify real XMage games through the public adapter
        if: ${{ !cancelled() && steps.xmage-prepare.outcome == 'success' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/Mtg_Projects;${{ github.workspace }}/Mtg_Projects/mtg_core
        run: |
          $reports = Join-Path $env:RUNNER_TEMP 'manaforge-xmage-reports'
          New-Item -ItemType Directory -Path $reports -Force | Out-Null
          foreach ($scenario in @('basic', 'combat', 'identity', 'commander-play', 'visibility', 'number', 'modes', 'sacrifice', 'distribution', 'triggers', 'copy', 'transform', 'partners', 'background', 'companion', 'blockers', 'cancellation', 'string-choice', 'piles', 'interruption')) {
            python -m mtg_play.adapter_acceptance --scenario $scenario --xmage-root "$env:RUNNER_TEMP/manaforge-xmage" --jdk-path "$env:JAVA_HOME" --output "$reports/$scenario.json"
            if ($LASTEXITCODE -ne 0) { throw "XMage scenario failed: $scenario" }
          }
          foreach ($seats in @(2, 3, 4, 5)) {
            python -m mtg_play.adapter_acceptance --scenario commander --seats $seats --xmage-root "$env:RUNNER_TEMP/manaforge-xmage" --jdk-path "$env:JAVA_HOME" --output "$reports/commander-$seats.json"
            if ($LASTEXITCODE -ne 0) { throw "XMage Commander scenario failed: $seats seats" }
          }
      - name: Upload sanitized XMage acceptance reports
        if: ${{ !cancelled() && matrix.python == '3.12' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xmage-acceptance
          path: |
            ${{ runner.temp }}/manaforge-xmage-reports
            Mtg_Projects/mtg_play/.runtime/*/events.jsonl
            Mtg_Projects/mtg_play/.runtime/*/peer-*/events.jsonl
            Mtg_Projects/mtg_play/.runtime/*/compile.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload library UI review screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: library-ui-python-${{ matrix.python }}
          path: ${{ runner.temp }}/manaforge-ui
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload paired categorization regression metrics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: categorization-evaluation-python-${{ matrix.python }}
          path: ${{ runner.temp }}/categorization-evaluation.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Lint scoped Core modules
        if: ${{ !cancelled() }}
        run: python -m ruff check .
      - name: Check scoped Core formatting
        if: ${{ !cancelled() }}
        run: python -m ruff format --check .

  windows-bundle:
    name: Optional Windows application bundle
    if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' && (inputs.build_windows || inputs.publish_windows_prerelease) && (needs.tests.result == 'success' || (inputs.skip_tests && needs.tests.result == 'skipped')) }}
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Prepare the environment expected by the existing build script
        run: |
          python -m venv Mtg_Projects/mtg_proxy/venv
          Mtg_Projects/mtg_proxy/venv/Scripts/python.exe -m pip install -r Mtg_Projects/mtg_proxy/requirements.txt
      - name: Build using the existing Manaforge packaging entry point
        shell: cmd
        run: call "Build Manaforge.cmd"
      - name: Verify packaged startup and bundled resources without network access
        if: ${{ !inputs.skip_tests }}
        env:
          QT_QPA_PLATFORM: offscreen
          PRINT_PROXY_PREP_DATA_DIR: ${{ runner.temp }}/manaforge-packaged-check
        run: |
          $bundleExe = Join-Path $env:GITHUB_WORKSPACE 'Mtg_Projects/dist/Manaforge/Manaforge.exe'
          $process = Start-Process -FilePath $bundleExe -ArgumentList '--verify-bundle' -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            Get-ChildItem -LiteralPath $env:PRINT_PROXY_PREP_DATA_DIR -Recurse -Filter '*.log' -ErrorAction SilentlyContinue | ForEach-Object { Get-Content -LiteralPath $_.FullName -Tail 100 }
            throw 'Packaged Manaforge startup check failed'
          }
      - name: Archive application files only
        run: Compress-Archive -LiteralPath Mtg_Projects/dist/Manaforge -DestinationPath Manaforge-Windows.zip
      - name: Build permanent GUI launcher
        run: |
          New-Item -ItemType Directory -Force launcher-output | Out-Null
          Add-Type -AssemblyName System.Drawing
          $icon = [Drawing.Icon]::ExtractAssociatedIcon((Join-Path $env:GITHUB_WORKSPACE 'Mtg_Projects/dist/Manaforge/Manaforge.exe'))
          $stream = [IO.File]::Create((Join-Path $env:GITHUB_WORKSPACE 'launcher-output/Manaforge.ico'))
          try { $icon.Save($stream) } finally { $stream.Dispose(); $icon.Dispose() }
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $launcherSource = Join-Path $env:GITHUB_WORKSPACE 'installer/Launcher.cs'
          $launcherIcon = Join-Path $env:GITHUB_WORKSPACE 'launcher-output/Manaforge.ico'
          $launcherExe = Join-Path $env:GITHUB_WORKSPACE 'launcher-output/Manaforge.exe'
          & $compiler /nologo /target:winexe /platform:anycpu /reference:System.Web.Extensions.dll /reference:System.Windows.Forms.dll /reference:System.Core.dll "/win32icon:$launcherIcon" "/out:$launcherExe" $launcherSource
          if ($LASTEXITCODE -ne 0) { throw 'Permanent launcher compilation failed' }
      - name: Inventory payload and compile per-user installer
        run: |
          python tools/application_inventory.py
          $versionLine = Get-Content Mtg_Projects/mtg_proxy/constants.py | Where-Object { $_ -match '^APP_VERSION = ' }
          $version = $versionLine.Split('"')[1]
          if ($version -notmatch '^\d+\.\d+\.\d+-(alpha|beta)\.1$') { throw 'Expected an alpha/beta version' }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) { throw 'Inno Setup 6 is required on the Windows runner' }
          & $compiler "/DAppVersion=$version" installer/Manaforge.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          Copy-Item installer-output/Manaforge-Setup.exe Manaforge-Setup.exe
          $lines = @('Manaforge-Setup.exe', 'Manaforge-Windows.zip') | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $_"
          }
          [IO.File]::WriteAllLines((Join-Path $env:GITHUB_WORKSPACE 'SHA256SUMS.txt'), $lines, [Text.UTF8Encoding]::new($false))
      - name: Smoke test installer without launching the application
        if: ${{ !inputs.skip_tests }}
        run: |
          $versionLine = Get-Content Mtg_Projects/mtg_proxy/constants.py | Where-Object { $_ -match '^APP_VERSION = ' }
          $version = $versionLine.Split('"')[1]
          $target = Join-Path $env:LOCALAPPDATA "Programs/Manaforge/versions/$version"
          $process = Start-Process -FilePath (Join-Path $env:GITHUB_WORKSPACE 'Manaforge-Setup.exe') -ArgumentList @('/VERYSILENT', '/NORESTART', "/DIR=`"$target`"", '/NOLAUNCH=1', '/TASKS=desktopicon') -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Installer smoke test failed' }
          $receipt = Get-Content -LiteralPath (Join-Path $target 'manaforge-install.json') | ConvertFrom-Json
          if ($receipt.version -ne $version -or !(Test-Path -LiteralPath (Join-Path $target 'Manaforge.exe'))) { throw 'Installer receipt or executable missing' }
          $permanent = Join-Path $env:LOCALAPPDATA 'Programs/Manaforge'
          $active = Get-Content -LiteralPath (Join-Path $permanent 'active-install.json') | ConvertFrom-Json
          if ($active.installations[0].version -ne $version) { throw 'Permanent launcher activation failed' }
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $shell.CreateShortcut((Join-Path ([Environment]::GetFolderPath('Programs')) 'Manaforge.lnk'))
          if ($shortcut.TargetPath -ne (Join-Path $permanent 'Manaforge.exe')) { throw 'Start Menu shortcut is not permanent' }
          $desktop = $shell.CreateShortcut((Join-Path ([Environment]::GetFolderPath('Desktop')) 'Manaforge.lnk'))
          if ($desktop.TargetPath -ne (Join-Path $permanent 'Manaforge.exe')) { throw 'Desktop shortcut is not permanent' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Manaforge-Windows
          path: |
            Manaforge-Windows.zip
            Manaforge-Setup.exe
            SHA256SUMS.txt
          retention-days: 7
      - name: Publish an application prerelease only when explicitly requested
        if: ${{ inputs.publish_windows_prerelease }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $versionLine = Get-Content Mtg_Projects/mtg_proxy/constants.py | Where-Object { $_ -match '^APP_VERSION = ' }
          $version = $versionLine.Split('"')[1]
          if ($version -notmatch '^\d+\.\d+\.\d+-(alpha|beta)\.1$') { throw 'Only alpha/beta application prereleases are allowed' }
          gh release create "v$version" Manaforge-Setup.exe SHA256SUMS.txt Manaforge-Windows.zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --latest=false --title "Manaforge $version" --notes 'Run Manaforge-Setup.exe for a per-user installation. Manaforge can download and verify this installer inside the application. Portable ZIP also available. Existing data remains in its configured location.'
          if ($LASTEXITCODE -ne 0) { throw 'Application prerelease publication failed' }

  recommendation-data:
    name: Validate and publish processed recommendation datasets
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.recommendation_release_tag != '' }}
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: recommendation-data-publication
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      DATA_RELEASE_TAG: ${{ inputs.recommendation_release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install data-tool dependency
        run: python -m pip install certifi
      - name: Download only the staged processed assets
        run: |
          if ($env:DATA_RELEASE_TAG -notmatch '^recommendations-[0-9][A-Za-z0-9.-]*-(alpha|beta)\.1$') { throw 'Invalid data prerelease tag' }
          gh release download $env:DATA_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir data-release --pattern '*.zip' --pattern manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve staged release assets' }
      - name: Validate assets and publish prerelease plus latest manifest
        run: python tools/recommendation_data.py promote --directory data-release --repository $env:GITHUB_REPOSITORY --commit $env:GITHUB_SHA
