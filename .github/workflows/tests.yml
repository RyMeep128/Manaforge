name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_windows:
        description: Build the existing Manaforge Windows bundle as a CI artifact
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Windows / Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            Mtg_Projects/mtg_proxy/requirements.txt
      - name: Install test and application dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test Proxy, Core, Deck Editor, and their integration
        working-directory: Mtg_Projects
        env:
          PRINT_PROXY_PREP_DATA_DIR: ${{ runner.temp }}/mtg-suite-test-data
        run: python -m pytest -vv --tb=short --durations=10 -o faulthandler_timeout=120 mtg_editor/tests integration_tests mtg_proxy/tests mtg_core/tests
      - name: Lint scoped Core modules
        if: ${{ !cancelled() }}
        run: python -m ruff check .
      - name: Check scoped Core formatting
        if: ${{ !cancelled() }}
        run: python -m ruff format --check .

  windows-bundle:
    name: Optional Windows application bundle
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_windows }}
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Prepare the environment expected by the existing build script
        run: |
          python -m venv Mtg_Projects/mtg_proxy/venv
          Mtg_Projects/mtg_proxy/venv/Scripts/python.exe -m pip install -r Mtg_Projects/mtg_proxy/requirements.txt
      - name: Build using the existing Manaforge packaging entry point
        shell: cmd
        run: call "Build Manaforge.cmd"
      - name: Archive application files only
        run: Compress-Archive -LiteralPath Mtg_Projects/dist/Manaforge -DestinationPath Manaforge-Windows.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Manaforge-Windows
          path: Manaforge-Windows.zip
          retention-days: 7
