name: Feedback relay
on: [push, pull_request]
permissions:
  contents: read
jobs:
  relay-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test feedback-relay/worker.test.mjs
