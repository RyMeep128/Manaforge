name: Play live Java opening
on:
  push:
    paths: ['Mtg_Projects/mtg_play/protocol/java/**', 'Mtg_Projects/mtg_play/java/*.java', 'Mtg_Projects/mtg_play/connection_proof.py', 'Mtg_Projects/mtg_play/artifacts.json', 'tools/check_play_live_opening.py', 'tools/play_native_metadata.py', '.github/workflows/play-live-opening.yml']
  pull_request:
    paths: ['Mtg_Projects/mtg_play/protocol/java/**', 'Mtg_Projects/mtg_play/java/*.java', 'Mtg_Projects/mtg_play/connection_proof.py', 'Mtg_Projects/mtg_play/artifacts.json', 'tools/check_play_live_opening.py', 'tools/play_native_metadata.py', '.github/workflows/play-live-opening.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-human-ai-opening:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: '${{ github.workspace }}/Mtg_Projects'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '23.0.2+7'
      - name: Prepare hash-pinned engine
        run: python -m mtg_play.ci_prepare --destination "$env:RUNNER_TEMP/manaforge-live-engine" --jdk-path "$env:JAVA_HOME"
      - name: Real Java-owned human versus AI opening
        run: python tools/check_play_live_opening.py --xmage-root "$env:RUNNER_TEMP/manaforge-live-engine" --jdk-path "$env:JAVA_HOME"
      - name: Real engine-offered land action
        run: python tools/check_play_live_opening.py --first-land --xmage-root "$env:RUNNER_TEMP/manaforge-live-engine" --jdk-path "$env:JAVA_HOME" --output Mtg_Projects/mtg_play_unity/Artifacts/FirstLand/report.json
      - name: Real zero-cost creature cast and resolution
        run: python tools/check_play_live_opening.py --first-creature --native-metadata --xmage-root "$env:RUNNER_TEMP/manaforge-live-engine" --jdk-path "$env:JAVA_HOME" --output Mtg_Projects/mtg_play_unity/Artifacts/FirstCreature/report.json
      - name: Real native attacker-selection finish
        run: python tools/check_play_live_opening.py --first-creature --native-metadata --finish-attacks --xmage-root "$env:RUNNER_TEMP/manaforge-live-engine" --jdk-path "$env:JAVA_HOME" --output Mtg_Projects/mtg_play_unity/Artifacts/CombatFinish/report.json
      - name: Real explicit attacker choice and native assignment
        run: python tools/check_play_live_opening.py --first-creature --native-metadata --select-attacker --xmage-root "$env:RUNNER_TEMP/manaforge-live-engine" --jdk-path "$env:JAVA_HOME" --output Mtg_Projects/mtg_play_unity/Artifacts/AttackerSelection/report.json
      - name: Real single-attacker declaration finish
        run: python tools/check_play_live_opening.py --first-creature --native-metadata --select-attacker --finish-selected-attack --xmage-root "$env:RUNNER_TEMP/manaforge-live-engine" --jdk-path "$env:JAVA_HOME" --output Mtg_Projects/mtg_play_unity/Artifacts/DeclaredAttack/report.json
      - name: Real post-declaration priority pass
        run: python tools/check_play_live_opening.py --first-creature --native-metadata --select-attacker --finish-selected-attack --declared-priority --xmage-root "$env:RUNNER_TEMP/manaforge-live-engine" --jdk-path "$env:JAVA_HOME" --output Mtg_Projects/mtg_play_unity/Artifacts/DeclaredPriority/report.json
      - name: Real combat-damage step and life change
        run: python tools/check_play_live_opening.py --first-creature --native-metadata --select-attacker --finish-selected-attack --declared-priority --combat-damage --xmage-root "$env:RUNNER_TEMP/manaforge-live-engine" --jdk-path "$env:JAVA_HOME" --output Mtg_Projects/mtg_play_unity/Artifacts/CombatDamage/report.json
      - name: Real combat cleanup to postcombat main
        run: python tools/check_play_live_opening.py --first-creature --native-metadata --select-attacker --finish-selected-attack --declared-priority --combat-damage --complete-combat --xmage-root "$env:RUNNER_TEMP/manaforge-live-engine" --jdk-path "$env:JAVA_HOME" --output Mtg_Projects/mtg_play_unity/Artifacts/CompleteCombat/report.json
      - name: Upload sanitized live evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: java-live-opening-${{ github.sha }}
          path: |
            Mtg_Projects/mtg_play_unity/Artifacts/LiveOpening/report.json
            Mtg_Projects/mtg_play_unity/Artifacts/FirstLand/report.json
            Mtg_Projects/mtg_play_unity/Artifacts/FirstCreature/report.json
            Mtg_Projects/mtg_play_unity/Artifacts/CombatFinish/report.json
            Mtg_Projects/mtg_play_unity/Artifacts/AttackerSelection/report.json
            Mtg_Projects/mtg_play_unity/Artifacts/DeclaredAttack/report.json
            Mtg_Projects/mtg_play_unity/Artifacts/DeclaredPriority/report.json
            Mtg_Projects/mtg_play_unity/Artifacts/CombatDamage/report.json
            Mtg_Projects/mtg_play_unity/Artifacts/CompleteCombat/report.json
          if-no-files-found: error
